project:
  type: book
  output-dir: docs

book:
  title: "Microbiome Data Visualization"
  subtitle: "From Raw Counts to Interpretable Community Patterns"

  chapters:
    - index.qmd

    - part: "Foundations"
      chapters:
        - 01-preface.qmd
        - 02-datasets.qmd

    - part: "Structure of Microbiome Data"
      chapters:
        - 03-data-structure-and-prevalence.qmd

    - part: "Community Visualization Layers"
      chapters:
        - 04-composition-visualization.qmd
        - 05-diversity-analysis.qmd
        - 06-ordination-plots.qmd
        - 07-heatmaps-and-patterns.qmd

    - part: "Summary & Next Steps"
      chapters:
        - 08-summary-and-next-steps.qmd

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: false
    css: assets/css/cdi.css
    code-fold: false

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
  working-dir: .